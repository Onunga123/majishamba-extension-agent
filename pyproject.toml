[project]
name = "majishamba-extension-agent"
version = "0.1.0"
description = "MajiShamba Extension Agent — climate-smart advisory for Kachieng Ward, Nyatike Sub-County, Migori County, Kenya"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "MajiShamba Team" }]
requires-python = ">=3.11"
keywords = ["agriculture", "climate-smart", "advisory", "mcp", "langgraph", "kenya", "migori"]
classifiers = [
    "Framework :: Django",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # Django
    "Django>=5.0,<5.2",
    # HTMX-friendly server rendering
    "django-htmx>=1.17",
    # Background jobs
    "django-rq>=2.10",
    # Queue/cache (Redis-compatible)
    "valkey>=6.0",
    # Templating / styling
    "django-tailwind>=3.8; python_version >= '3.11'",
    # LangGraph orchestration
    "langgraph>=0.2",
    # Official MCP Python SDK
    "mcp>=1.0",
    # Open-weights model client (Ollama)
    "ollama>=0.3",
    # Schemas / validation
    "pydantic>=2.7",
    # HTTP fetching helpers (used by weather/market tools in real deployments)
    "httpx>=0.27",
    # CLI
    "rich>=13.7",
    # ASGI server used in dev
    "whitenoise>=6.6",
    # Pretty logging for audit events
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
gis = [
    # PostGIS optional; we keep GIS fields optional so demo runs on SQLite
    "GDAL>=3.6; platform_system == 'Linux'",
]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "flake8>=7.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "semgrep>=1.78",
    "factory-boy>=3.3",
    "playwright>=1.44",
    "ipython>=8.20",
]

[project.scripts]
majishamba-mcp = "apps.mcp_tools.server:main"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra --strict-markers --reuse-db"
markers = [
    "integration: end-to-end integration tests",
    "security: security and governance tests",
    "e2e: browser-level tests with Playwright",
    "slow: tests that take longer than 1s",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "ANN"]
ignore = ["ANN101", "ANN102", "DJ001", "S101", "S105", "S106"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = "/(migrations|\\.venv|build|dist)/"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = "migrations/"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]
