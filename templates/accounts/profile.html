{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto mt-6 bg-white p-6 rounded shadow border border-stone-200">
  <h1 class="text-xl font-semibold mb-3">Officer profile</h1>
  <dl class="text-sm">
    <dt class="font-medium">Name</dt><dd>{{ user.display_name }}</dd>
    <dt class="font-medium mt-2">Role</dt><dd>{{ user.get_role_display }}</dd>
    <dt class="font-medium mt-2">Sub-county</dt><dd>{{ user.sub_county }}</dd>
    <dt class="font-medium mt-2">Ward</dt><dd>{{ user.ward }}</dd>
  </dl>
</div>
{% endblock %}
