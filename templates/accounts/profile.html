{% extends "base.html" %}
{% block title %}Profile — Kachieng’ AI Agent{% endblock %}
{% block content %}
<header class="mb-6">
  <h1 class="text-2xl font-semibold text-stone-900">Officer profile</h1>
  <p class="text-sm text-stone-600 mt-1">Your account details and role assignment.</p>
</header>

<div class="max-w-2xl mx-auto bg-white p-6 rounded shadow border border-stone-200">
  <dl class="text-sm space-y-3">
    <div class="flex flex-col sm:flex-row sm:gap-4">
      <dt class="font-medium text-stone-700 sm:w-32 sm:flex-shrink-0">Name</dt>
      <dd>{{ user.display_name }}</dd>
    </div>
    <div class="flex flex-col sm:flex-row sm:gap-4">
      <dt class="font-medium text-stone-700 sm:w-32 sm:flex-shrink-0">Role</dt>
      <dd>{{ user.get_role_display }}</dd>
    </div>
    <div class="flex flex-col sm:flex-row sm:gap-4">
      <dt class="font-medium text-stone-700 sm:w-32 sm:flex-shrink-0">Sub-county</dt>
      <dd>{{ user.sub_county }}</dd>
    </div>
    <div class="flex flex-col sm:flex-row sm:gap-4">
      <dt class="font-medium text-stone-700 sm:w-32 sm:flex-shrink-0">Ward</dt>
      <dd>{{ user.ward }}</dd>
    </div>
  </dl>
</div>
{% endblock %}
