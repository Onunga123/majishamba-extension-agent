{% extends "base_auth.html" %}
{% block title %}Sign in — Kachieng AI Agent{% endblock %}
{% block content %}
<div class="bg-white p-6 rounded shadow border border-stone-200">
  <h1 class="text-xl font-semibold">Sign in</h1>

  <form method="post" class="space-y-4 mt-4" novalidate>
    {% csrf_token %}
    {% if form.errors %}
      <div class="bg-red-50 border border-red-300 text-red-800 text-sm p-3 rounded" role="alert" aria-live="assertive">
        <p class="font-medium">Sign in failed</p>
        <p class="mt-1">Please check your username and password and try again.</p>
      </div>
    {% endif %}
    <div>
      <label class="block text-sm font-medium mb-1" for="id_username">Username</label>
      <input id="id_username" name="username" class="w-full border border-stone-300 rounded px-3 py-2 focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 outline-none transition" autocomplete="username" required aria-required="true">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="id_password">Password</label>
      <div class="relative">
        <input id="id_password" name="password" type="password" class="w-full border border-stone-300 rounded px-3 py-2 pr-12 focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 outline-none transition" autocomplete="current-password" required aria-required="true">
        <button type="button"
                onclick="var p=document.getElementById('id_password');p.type=p.type==='password'?'text':'password';this.setAttribute('aria-label',p.type==='password'?'Show password':'Hide password');this.querySelector('svg').classList.toggle('hidden');this.querySelector('svg:last-child').classList.toggle('hidden')"
                class="absolute right-3 top-3 text-stone-400 hover:text-stone-700 focus:outline-none focus:ring-2 focus:ring-emerald-600 rounded"
                aria-label="Show password">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-7-10-7a13.16 13.16 0 0 1 1.67-2.68"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="w-full bg-emerald-700 text-white px-4 py-2.5 rounded font-medium hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:ring-offset-2 transition">
      Sign in
    </button>
  </form>

  <div class="mt-6 pt-4 border-t border-stone-200 text-center space-y-1">
    <p class="text-sm text-stone-600">
      Need an account? <a href="{% url 'accounts:register' %}" class="text-emerald-700 hover:underline font-medium focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-700 rounded">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
