{% extends "base.html" %}
{% block title %}Login — MajiShamba{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white p-6 rounded shadow border border-stone-200">
  <h1 class="text-xl font-semibold mb-3">Nyatike Extension Officer Login</h1>
  <form method="post" class="space-y-3">
    {% csrf_token %}
    {% if form.errors %}
      <div class="text-red-700 text-sm">{{ form.errors }}</div>
    {% endif %}
    <div>
      <label class="block text-sm font-medium">Username</label>
      <input name="username" class="w-full border border-stone-300 rounded px-3 py-2" autocomplete="username" required>
    </div>
    <div>
      <label class="block text-sm font-medium">Password</label>
      <input name="password" type="password" class="w-full border border-stone-300 rounded px-3 py-2" autocomplete="current-password" required>
    </div>
    <button type="submit" class="bg-emerald-700 text-white px-4 py-2 rounded hover:bg-emerald-800">Login</button>
  </form>
  <p class="mt-4 text-xs text-stone-500">
    Demo officer: <code>nyatike_officer</code> / <code>majishamba-demo-2025</code> (created by <code>make demo</code>).
  </p>
</div>
{% endblock %}
